# Nginx у контейнері web (практичне завдання № 6): сторінка React і зворотний проксі для API.
server {
  listen 80;
  server_tokens off;                                  # не повідомляти версію Nginx
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://bank.gov.ua; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # маршрути React Router (/books/2, /login) – це один файл index.html
  location / {
    try_files $uri /index.html;
  }
  # зібрані файли мають хеш у назві – їх можна кешувати назавжди
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
